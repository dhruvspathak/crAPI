apiVersion: v1
kind: ConfigMap
metadata:
  name: crapi-identity-configmap
  labels:
    app: crapi-identity
data:
  DB_HOST: postgresdb
  JWT_SECRET: "" #Used for creating a JWT. Provide via Kubernetes Secret or override
  DB_USER: admin
  DB_PASSWORD: ""
  DB_NAME: crapi
  DB_PORT: "5432"
  APP_NAME: "crapi-identity"
  ENABLE_SHELL_INJECTION: "false"
  ENABLE_LOG4J: "true"
  MAILHOG_HOST: mailhog
  MAILHOG_PORT: "1025"
  MAILHOG_DOMAIN: "example.com"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_EMAIL: "user@example.com"
  SMTP_PASS: ""
  SMTP_FROM: "no-reply@example.com"
  SMTP_AUTH: "true"
  JWT_EXPIRATION: "604800000"
  SMTP_STARTTLS: "true"
  SERVER_PORT: "8080"
  TLS_ENABLED: "false"
  API_GATEWAY_URL: "https://api.mypremiumdealership.com"
